# Credentials come from core-api/.env (git-ignored); Compose reads it automatically.
# Start from the template: cp .env.example .env
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geocore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-geocore}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ = read the variable inside the container, not from .env at startup
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      # Inside Docker the API reaches Postgres by service name "db" on 5432,
      # so this overrides the localhost:5433 DATABASE_URL in .env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-geocore}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-geocore}
      ENVIRONMENT: local
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
