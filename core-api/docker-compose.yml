services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: geocore
      POSTGRES_PASSWORD: geocore
      POSTGRES_DB: geocore
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocore -d geocore"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://geocore:geocore@db:5432/geocore
      ENVIRONMENT: local
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

